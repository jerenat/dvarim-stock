# /var/www/ihrapps/dvarim-app/docker-compose.yml
version: '3.8'

services:
  # Backend DVARIM
  stock-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://holybible-mongo:27017/stock_pro
      JWT_SECRET: ${JWT_SECRET:-dvarim_jwt_super_secret_2024}
      FRONTEND_URL: https://dvarim.ihrapps.com
    networks:
      - ihrapps_internal

  # Frontend DVARIM
  stock-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-frontend
    restart: unless-stopped
    networks:
      - ihrapps_internal

networks:
  ihrapps_internal:
    external: true