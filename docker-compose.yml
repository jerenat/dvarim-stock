version: "3.9"

services:
  backend:
    build: ./server
    container_name: stock-backend

    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: stock-frontend

    restart: unless-stopped

    ports:
      - "8081:4173"

    depends_on:
      - backend
