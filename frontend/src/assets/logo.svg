<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58AAF5" />
      <stop offset="65%" stop-color="#58AAF5" />
      <stop offset="100%" stop-color="#586AF5" />
    </linearGradient>
    <filter id="boxShadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="5" dy="7" stdDeviation="5" flood-color="#1a2860" flood-opacity="0.38" />
    </filter>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#e8f0ff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#586AF5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#58AAF5" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background rounded square tile -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" />

  <!-- Three boxes in brick / staggered arrangement -->
  <g filter="url(#boxShadow)">
    <!-- Top box -->
    <rect x="71" y="58" width="58" height="38" rx="9" fill="url(#boxGrad)" />
    <rect x="71" y="58" width="58" height="11" rx="0" fill="url(#labelGrad)" />
    <circle cx="81" cy="63.5" r="2.8" fill="#586AF5" opacity="0.35" />
    <rect x="89" y="61" width="2" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="93" y="61" width="3" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="98" y="61" width="1.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="101.5" y="61" width="2.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />

    <!-- Bottom-left box -->
    <rect x="39" y="103" width="58" height="38" rx="9" fill="url(#boxGrad)" />
    <rect x="39" y="103" width="58" height="11" rx="0" fill="url(#labelGrad)" />
    <circle cx="49" cy="108.5" r="2.8" fill="#586AF5" opacity="0.35" />
    <rect x="57" y="106" width="2" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="61" y="106" width="3" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="66" y="106" width="1.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="69.5" y="106" width="2.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />

    <!-- Bottom-right box -->
    <rect x="103" y="103" width="58" height="38" rx="9" fill="url(#boxGrad)" />
    <rect x="103" y="103" width="58" height="11" rx="0" fill="url(#labelGrad)" />
    <circle cx="113" cy="108.5" r="2.8" fill="#586AF5" opacity="0.35" />
    <rect x="121" y="106" width="2" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="125" y="106" width="3" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="130" y="106" width="1.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
    <rect x="133.5" y="106" width="2.5" height="5" rx="0.5" fill="#586AF5" opacity="0.22" />
  </g>
</svg>
